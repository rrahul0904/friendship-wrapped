name: Production CI

on:
  push:
    branches:
      - main
      - production-all-phases
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify client bundles contain no server secret identifiers
        shell: bash
        run: |
          if grep -R -n -E 'STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|ENTITLEMENT_SIGNING_SECRET|SUPABASE_SECRET_KEY|OPENAI_API_KEY' .next/static; then
            echo "Server-only secret identifier found in a client bundle."
            exit 1
          fi
          echo "Client bundle secret scan passed."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
